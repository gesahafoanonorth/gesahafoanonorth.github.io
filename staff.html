<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GES Ahafo Ano North - Staff Register</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f9f6f0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .register-container {
            background: #ffffff;
            width: 100%;
            max-width: 1200px;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid #cccccc;
        }

        .header-title {
            text-align: center;
            color: #2b579a;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* Top Bar: Academic Info & Actions */
        .top-bar {
            border: 2px solid #8b2500;
            padding: 12px;
            border-radius: 4px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            background-color: #fafafa;
        }

        .top-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-input-group label {
            font-size: 13px;
            font-weight: bold;
            color: #333;
        }

        .top-input-group input {
            padding: 6px 10px;
            border: 1px solid #cccccc;
            outline: none;
            width: 150px;
        }

        /* Action Buttons Header Layout */
        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 6px 16px;
            font-size: 13px;
            font-weight: bold;
            color: white;
            border: 1px solid #555555;
            cursor: pointer;
            border-radius: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-save { background-color: #5cb85c; }
        .btn-new { background-color: #5bc0de; }
        .btn-update { background-color: #f0ad4e; }
        .btn-delete { background-color: #d9534f; }
        .btn-clear { background-color: #ffffff; color: #333; }
        .btn-back { background-color: #777777; }

        /* Main Form Grid Configuration */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        fieldset {
            border: 2px solid #2b579a;
            border-radius: 6px;
            padding: 15px;
            background-color: #ffffff;
        }

        legend {
            font-size: 14px;
            font-weight: bold;
            color: #d9534f;
            padding: 0 8px;
        }

        .field-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .field-row label {
            width: 140px;
            font-size: 12px;
            font-weight: bold;
            color: #444444;
            text-transform: uppercase;
        }

        .field-row input, .field-row select {
            flex: 1;
            padding: 6px 8px;
            border: 1px solid #cccccc;
            border-radius: 3px;
            font-size: 13px;
            outline: none;
        }

        .field-row input:focus, .field-row select:focus {
            border-color: #2b579a;
        }

        .read-only-bg {
            background-color: #fff3cd;
        }

        /* Full Width Section Styles */
        .full-width-section {
            grid-column: 1 / -1;
        }

        .finance-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .finance-row .field-row {
            flex: 1;
            min-width: 250px;
        }

        /* Bottom Search & Table Layout */
        .search-container {
            margin-top: 30px;
            border-top: 1px solid #cccccc;
            padding-top: 20px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            max-width: 500px;
        }

        .search-bar input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #cccccc;
            border-radius: 4px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .data-table th, .data-table td {
            border: 1px solid #2b579a;
            padding: 10px;
            text-align: left;
            font-size: 13px;
        }

        .data-table th {
            background-color: #fafafa;
            color: #333333;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <div class="header-title">Staff Register</div>

        <form id="registerForm" onsubmit="event.preventDefault();">
            
            <!-- Top Controls bar -->
            <div class="top-bar">
                <div class="top-input-group">
                    <label>ACADEMIC YEAR</label>
                    <input type="text" placeholder="e.g. 2026/2027">
                </div>
                <div class="top-input-group">
                    <label>ACADEMIC TERM</label>
                    <input type="text" placeholder="e.g. Term 1">
                </div>

                <div class="action-buttons">
                    <button type="submit" class="btn btn-save" onclick="alert('Record Saved Successfully!')">💾 SAVE</button>
                    <button type="button" class="btn btn-new" onclick="document.getElementById('registerForm').reset()">📄 NEW ENTRY</button>
                    <button type="button" class="btn btn-update" onclick="alert('Record Updated!')">🔄 UPDATE</button>
                    <button type="button" class="btn btn-delete" onclick="alert('Record Deleted!')">❌ DELETE</button>
                    <button type="button" class="btn btn-clear" onclick="document.getElementById('registerForm').reset()">CLEAR</button>
                    <button type="button" class="btn btn-back" onclick="window.location.href='dashboard.html'">BACK</button>
                </div>
            </div>

            <div class="form-grid">
                
                <!-- Group 1: Personal Information -->
                <fieldset>
                    <legend>Personal Information</legend>
                    <div class="field-row">
                        <label>Teacher ID</label>
                        <input type="text">
                    </div>
                    <div class="field-row">
                        <label>Title</label>
                        <select>
                            <option value=""></option>
                            <option value="Mr">Mr.</option>
                            <option value="Mrs">Mrs.</option>
                            <option value="Ms">Ms.</option>
                            <option value="Dr">Dr.</option>
                        </select>
                    </div>
                    <div class="field-row">
                        <label>Surname</label>
                        <input type="text">
                    </div>
                    <div class="field-row">
                        <label>Other Names</label>
                        <input type="text">
                    </div>
                    <div class="field-row">
                        <label>Gender</label>
                        <select>
                            <option value=""></option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                    <div class="field-row">
                        <label>Date of Birth</label>
                        <input type="date">
                    </div>
                    <div class="field-row">
                        <label>Age</label>
                        <input type="text" class="read-only-bg" placeholder="Auto-calculated">
                    </div>
                    <div class="field-row">
                        <label>Religion</label>
                        <select>
                            <option value=""></option>
                            <option value="Christianity">Christianity</option>
                            <option value="Islam">Islam</option>
                            <option value="Traditional">Traditional</option>
                        </select>
                    </div>
                </fieldset>

                <!-- Group 2: Academic And School Details -->
                <fieldset>
                    <legend>Academic And School Details</legend>
                    <div class="field-row">
                        <label>Circuit</label>
                        <select><option></option></select>
                    </div>
                    <div class="field-row">
                        <label>Name of School</label>
                        <select><option></option></select>
                    </div>
                    <div class="field-row">
                        <label>Association Type</label>
                        <select><option></option></select>
                    </div>
                    <div class="field-row">
                        <label>Staff Type</label>
