<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GES Ahafo Ano North - Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f9f6f0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard-container {
            background: #ffffff;
            width: 100%;
            max-width: 700px; /* Expanded slightly to account for dual columns */
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(139, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .district-badge {
            display: inline-block;
            background-color: rgba(139, 0, 0, 0.08);
            color: #8b0000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 18px;
            color: #8b0000;
            font-weight: 700;
            margin-bottom: 5px;
            line-height: 1.3;
        }

        .header h2 {
            font-size: 15px;
            color: #333333;
            font-weight: 600;
        }

        .section-divider {
            font-size: 12px;
            font-weight: 700;
            color: #666666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 20px 0 10px 5px;
            padding-bottom: 4px;
            border-bottom: 1px dashed #e0e0e0;
        }

        /* Responsive Grid: Stacks vertically on tiny screens, splits horizontally on wider devices */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        /* Interactive Action Buttons */
        .menu-card {
            background-color: #fafafa;
            border: 1px solid #e0e0e0;
            padding: 15px 18px;
            border-radius: 12px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            width: 100%;
            height: 100%; /* Ensures equal heights in rows */
        }

        .menu-card:hover {
            border-color: #8b0000;
            background-color: rgba(139, 0, 0, 0.02);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(139, 0, 0, 0.04);
        }

        .menu-info h3 {
            font-size: 14px;
            color: #8b0000;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .menu-info p {
            font-size: 11px;
            color: #666666;
            line-height: 1.3;
        }

        .arrow-icon {
            color: #8b0000;
            font-weight: bold;
            font-size: 16px;
            margin-left: 10px;
        }

        .btn-logout {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            background-color: #e0e0e0;
            color: #333333;
            transition: background-color 0.2s ease;
        }

        .btn-logout:hover {
            background-color: #d0d0d0;
        }

        /* Desktop & Tablet Optimization Breakpoint: Aligns modules side-by-side */
        @media (min-width: 480px) {
            .menu-grid {
                grid-template-columns: repeat(2, 1fr); /* Creates 2 columns on top rows */
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            <span class="district-badge">GES Management Hub</span>
            <h1>AHAFO ANO NORTH EDUCATION DIRECTORATE</h1>
            <h2>Main Control Panel</h2>
        </div>

        <!-- SECTION A: SCHOOL MASTER LISTS -->
        <div class="section-divider">School Master Records</div>
        <div class="menu-grid">
            <!-- Basic Schools Button -->
            <button class="menu-card" onclick="window.location.href='school-basic.html';">
                <div class="menu-info">
                    <h3>Basic Schools Register</h3>
                    <p>Compile official profiles for KG, Primary, and JHS institutions</p>
                </div>
                <div class="arrow-icon">➔</div>
            </button>

            <!-- Second Cycle Schools Button -->
            <button class="menu-card" onclick="window.location.href='school-second-cycle.html';">
                <div class="menu-info">
                    <h3>Second Cycle Register</h3>
                    <p>Track profiles for SHS, SHTS, TVET, and STEM institutions</p>
                </div>
                <div class="arrow-icon">➔</div>
            </button>

            <!-- School Infrastructure Button -->
            <button class="menu-card" onclick="window.location.href='school-infrastructure.html';">
                <div class="menu-info">
                    <h3>School Infrastructure</h3>
                    <p>Log inventory, desk counts, laboratory status, and utilities</p>
                </div>
                <div class="arrow-icon">➔</div>
            </button>
        </div>

        <!-- SECTION B: OPERATIONAL METRICS -->
        <div class="section-divider">Data Log Modules</div>
        <div class="menu-grid">
            <!-- Basic Enrolment -->
            <button class="menu-card" onclick="window.location.href='enrolment.html';">
                <div class="menu-info">
                    <h3>Basic Enrolment Log</h3>
                    <p>Submit class population statistics for active terms</p>
                </div>
                <div class="arrow-icon">➔</div>
            </button>

            <!-- Manage Staff -->
            <button class="menu-card" onclick="window.location.href='staff.html';">
                <div class="menu-info">
                    <h3>Manage Staff</h3>
                    <p>Track teachers, professional ranks, IDs, and positions</p>
                </div>
                <div class="arrow-icon">➔</div>
            </button>

            <!-- Manage Student -->
            <button class="menu-card" onclick="window.location.href='student.html';">
                <div class="menu-info">
                    <h3>Manage Student</h3>
                    <p>Update enrollment data, attendance, and BECE registries</p>
                </div>
                <div class="arrow-icon">➔</div>
            </button>
        </div>

        <!-- Back/Logout Action -->
        <button type="button" class="btn-logout" onclick="window.location.href='index.html'">Logout</button>
    </div>

</body>
</html>
