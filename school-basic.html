<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic School Master Records</title>
  <!-- Tailwind CSS v4 CDN Engine Import -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#FAF6F0] min-h-screen p-4 md:p-8 font-sans text-gray-800 flex justify-center items-start">

  <!-- MASTER ENTRY FORM CONTAINER -->
  <div class="w-full max-w-7xl bg-white p-4 md:p-8 rounded-md shadow-sm border border-gray-300">
    
    <!-- CENTER MAIN HEADER BANNER -->
    <div class="text-center text-[#8B0000] text-xl md:text-2xl font-bold tracking-wide uppercase mb-6">
      Basic School Master List Compiling
    </div>
    
    <form id="schoolBasicForm">
      
      <!-- TOP CONTROL ACTION BAR -->
      <div class="border border-[#8B0000] p-4 rounded-md flex flex-col sm:flex-row sm:justify-end gap-3 mb-8 bg-transparent">
        <button type="submit" class="w-full sm:w-auto bg-[#8B0000] hover:bg-[#700000] text-white font-bold py-2 px-8 rounded tracking-wide uppercase text-xs transition-colors cursor-pointer">
          Submit
        </button>
        <button type="button" onclick="window.location.href='dashboard.html'" class="w-full sm:w-auto bg-[#5A5C5E] hover:bg-[#454749] text-white font-bold py-2 px-8 rounded tracking-wide uppercase text-xs transition-colors cursor-pointer">
          Back
        </button>
      </div>

      <!-- MAIN MULTI-COLUMN LAYOUT GRID -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- BLOCK 1: SCHOOL INFO & EMIS -->
        <fieldset class="border border-[#8B0000] rounded-md p-5 pt-3 bg-white">
          <legend class="text-xs font-bold tracking-wider text-[#8B0000] px-2 uppercase bg-white ml-2">
            School Info & EMIS
          </legend>
          <div class="space-y-3 mt-2">
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">1. MMDA Name</label>
              <input type="text" id="mmdaName" value="Ahafo Ano North Municipal" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-[#8B0000]" required>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">2. School Name</label>
              <input type="text" id="schoolName" placeholder="Official Institution Name" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm placeholder-gray-400 focus:outline-none focus:border-[#8B0000]" required>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">3. Circuit</label>
              <input type="text" id="circuit" placeholder="As designated" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm placeholder-gray-400 focus:outline-none focus:border-[#8B0000]" required>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">4. School EMIS Code</label>
              <input type="text" id="emisCode" placeholder="Numbers only" pattern="[0-9]+" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm placeholder-gray-400 focus:outline-none focus:border-[#8B0000]" required>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">5. School Email</label>
              <input type="email" id="schoolEmail" placeholder="e.g. school@ges.gov.gh" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm placeholder-gray-400 focus:outline-none focus:border-[#8B0000]">
            </div>
          </div>
        </fieldset>

        <!-- BLOCK 2: MODEL & OPERATIONAL LEVEL -->
        <fieldset class="border border-[#8B0000] rounded-md p-5 pt-3 bg-white">
          <legend class="text-xs font-bold tracking-wider text-[#8B0000] px-2 uppercase bg-white ml-2">
            Model & Operational Level
          </legend>
          <div class="space-y-3 mt-2">
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">6. School Model</label>
              <select id="schoolModel" class="flex-1 border border-gray-300 bg-white rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-[#8B0000]" required>
                <option value="" disabled selected>-- Select Model --</option>
                <option value="Mainstream">Mainstream</option>
                <option value="Integrated">Integrated</option>
                <option value="Special School">Special School</option>
              </select>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">7. Level</label>
              <select id="schoolLevel" class="flex-1 border border-gray-300 bg-white rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-[#8B0000]" required>
                <option value="" disabled selected>-- Select Level --</option>
                <option value="KG">KG Only</option>
                <option value="Primary">Primary Only</option>
                <option value="JHS">JHS Only</option>
                <option value="Basic">Basic (KG, Primary & JHS)</option>
              </select>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">8. Affiliation Type</label>
              <select id="affiliationType" class="flex-1 border border-gray-300 bg-white rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-[#8B0000]" required>
                <option value="" disabled selected>-- Select Affiliation --</option>
                <option value="Public">Public/Government</option>
                <option value="Mission">Mission School</option>
                <option value="Private">Private</option>
              </select>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">9. Ownership Type</label>
              <select id="ownershipType" class="flex-1 border border-gray-300 bg-white rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-[#8B0000]" required>
                <option value="" disabled selected>-- Select Ownership --</option>
                <option value="Public">Public</option>
                <option value="Private">Private</option>
              </select>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">10. School Religion</label>
              <select id="schoolReligion" class="flex-1 border border-gray-300 bg-white rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-[#8B0000]" required>
                <option value="" disabled selected>-- Select Religion --</option>
                <option value="Christian">Christianity</option>
                <option value="Islamic">Islam</option>
                <option value="None">Non-Religious</option>
              </select>
            </div>
          </div>
        </fieldset>

        <!-- BLOCK 3: HEADTEACHER DETAILS -->
        <fieldset class="border border-[#8B0000] rounded-md p-5 pt-3 bg-white">
          <legend class="text-xs font-bold tracking-wider text-[#8B0000] px-2 uppercase bg-white ml-2">
            11. Headteacher Details
          </legend>
          <div class="space-y-3 mt-2">
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">11A. Headteacher Name</label>
              <input type="text" id="headName" placeholder="Full Name" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-[#8B0000]" required>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">11B. Staff ID</label>
              <input type="text" id="headStaffId" placeholder="5-7 digits" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-[#8B0000]" required>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">11C. Phone Number</label>
              <input type="tel" id="headPhone" placeholder="e.g. 0241234567" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-[#8B0000]" required>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">11D. Email Address</label>
              <input type="email" id="headEmail" placeholder="e.g. name@example.com" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-[#8B0000]">
            </div>
          </div>
        </fieldset>

        <fieldset class="border border-[#8B0000] rounded-md p-5 pt-3 bg-white">
          <legend class="text-xs font-bold tracking-wider text-[#8B0000] px-2 uppercase bg-white ml-2">
            Assistant Headteacher Profiles
          </legend>
          <div class="space-y-4 mt-2">
            <div class="border-b border-gray-200 pb-2">
              <div class="text-[11px] font-bold text-[#8B0000] uppercase mb-2">12. Headteacher (KG) Details</div>
              <div class="grid grid-cols-1 gap-2">
                <input type="text" placeholder="12a. Assistant Head KG Name" class="w-full border border-gray-300 rounded px-3 py-1 text-sm focus:outline-none focus:border-[#8B0000]">
                <div class="grid grid-cols-2 gap-2">
                  <input type="text" placeholder="12b. Staff ID" class="w-full border border-gray-300 rounded px-3 py-1 text-sm focus:outline-none focus:border-[#8B0000]">
                  <input type="tel" placeholder="12c. Phone" class="w-full border border-gray-300 rounded px-3 py-1 text-sm focus:outline-none focus:border-[#8B0000]">
                </div>
              </div>
            </div>
            
            <div class="border-b border-gray-200 pb-2">
              <div class="text-[11px] font-bold text-[#8B0000] uppercase mb-2">13. Assistant Headteacher (Primary) Details</div>
              <div class="grid grid-cols-1 gap-2">
                <input type="text" placeholder="13a. Assistant Head Primary Name" class="w-full border border-gray-300 rounded px-3 py-1 text-sm focus:outline-none focus:border-[#8B0000]">
                <div class="grid grid-cols-2 gap-2">
                  <input type="text" placeholder="13b. Staff ID" class="w-full border border-gray-300 rounded px-3 py-1 text-sm focus:outline-none focus:border-[#8B0000]">
                  <input type="tel" placeholder="13c. Phone" class="w-full border border-gray-300 rounded px-3 py-1 text-sm focus:outline-none focus:border-[#8B0000]">
                </div>
              </div>
            </div>

            <div>
              <div class="text-[11px] font-bold text-[#8B0000] uppercase mb-2">14. Assistant Headteacher (JHS) Details</div>
              <div class="grid grid-cols-1 gap-2">
                <input type="text" placeholder="14a. Assistant Head JHS Name" class="w-full border border-gray-300 rounded px-3 py-1 text-sm focus:outline-none focus:border-[#8B0000]">
                <div class="grid grid-cols-2 gap-2">
                  <input type="text" placeholder="14b. Staff ID" class="w-full border border-gray-300 rounded px-3 py-1 text-sm focus:outline-none focus:border-[#8B0000]">
                  <input type="tel" placeholder="14c. Phone" class="w-full border border-gray-300 rounded px-3 py-1 text-sm focus:outline-none focus:border-[#8B0000]">
                </div>
              </div>
            </div>
          </div>
        </fieldset>

        <fieldset class="border border-[#8B0000] rounded-md p-5 pt-3 bg-white md:col-span-2">
          <legend class="text-xs font-bold tracking-wider text-[#8B0000] px-2 uppercase bg-white ml-2">
            School Location & Logistics
          </legend>
          <div class="space-y-3 mt-2">
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">15. Area Type</label>
              <select id="areaType" class="flex-1 border border-gray-300 bg-white rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-[#8B0000]" required>
                <option value="" disabled selected>-- Select Area Type --</option>
                <option value="Urban">Urban</option>
                <option value="Rural">Rural</option>
              </select>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">16. School Location</label>
              <input type="text" id="schoolLocation" placeholder="Town / Community / Landmark" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-[#8B0000]" required>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">17. GPS Address</label>
              <input type="text" id="gpsAddress" placeholder="e.g. AK-123-4567" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-[#8B0000]" required>
            </div>
          </div>
        </fieldset>

      </div>
    </form>
  </div>

  <script>
    document.getElementById('schoolBasicForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert("Basic School Master Record saved successfully!");
    });
  </script>
</body>
</html>
