<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GES Ahafo Ano North - Basic Enrolment</title>
    <!-- Links to your existing responsive style profile -->
    <link rel="stylesheet" href="style.css">
    <style>
        .btn-new-e { background-color: #00a2e8 !important; color: #fff !important; }
        .btn-delete-e { background-color: #ed1c24 !important; color: #fff !important; }
        .btn-save-e { background-color: #22b14c !important; color: #fff !important; }
        .btn-clear-e { background-color: #b9cde5; color: #333 !important; }
        .btn-back-e { background-color: #f3f3f3; color: #333 !important; border: 1px solid #ccc !important; }
        
        .sub-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            align-items: center;
            margin-top: 5px;
        }
        .total-box {
            background-color: #e9ecef !important;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="enrolment-mount"></div>

    <!-- Links directly to the script containing the enrolment layout layout -->
