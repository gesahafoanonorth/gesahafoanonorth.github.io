<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GES - Basic School Master Profile Setup</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fff8f8; margin: 0; padding: 20px; }
        
        /* Master Hub Navigation Bar Layout */
        .hub-nav-bar { display: flex; flex-wrap: wrap; gap: 8px; background-color: #800000; padding: 12px; border-radius: 6px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .hub-nav-btn { text-decoration: none; padding: 7px 14px; background-color: rgba(255, 255, 255, 0.15); color: #ffffff; border-radius: 4px; font-size: 12px; font-weight: bold; border: 1px solid rgba(255,255,255,0.1); transition: background-color 0.2s, border-color 0.2s; }
        .hub-nav-btn:hover { background-color: rgba(255, 255, 255, 0.3); border-color: #ffffff; }
        .hub-nav-btn.active { background-color: #ffffff; color: #800000; border-color: #ffffff; cursor: default; }
        .hub-nav-btn.logout { background-color: #e0e0e0; color: #333333; margin-left: auto; border: none; }
        .hub-nav-btn.logout:hover { background-color: #d4d4d4; }

        /* Form Presentation Layout Setup */
        .form-container { background: #ffffff; padding: 30px; border: 1px solid #ebdcd0; border-radius: 8px; max-width: 750px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .form-title { color: #800000; font-size: 20px; font-weight: bold; text-transform: uppercase; border-bottom: 3px solid #800000; padding-bottom: 8px; margin-bottom: 25px; letter-spacing: 0.5px; }
        
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 11px; font-weight: bold; color: #333333; text-transform: uppercase; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid #cccccc; border-radius: 4px; font-size: 14px; color: #333333; width: 100%; box-sizing: border-box; }
        .form-group input::placeholder { color: #aaaaaa; }
        
        .form-container button[type="submit"] { width: 100%; padding: 12px; background-color: #800000; color: #ffffff; border: none; font-weight: bold; font-size: 13px; border-radius: 4px; cursor: pointer; text-transform: uppercase; transition: background-color 0.2s; margin-top: 10px; }
        .form-container button[type="submit"]:hover { background-color: #600000; }
    </style>
</head>
<body>
    <!-- Master Shared Hub Navigation System Bar -->
    <div class="hub-nav-bar">
        <a href="school-basic.html" class="hub-nav-btn active">Basic Schools</a>
        <a href="school-second-cycle.html" class="hub-nav-btn">Second Cycle</a>
        <a href="school-infrastructure.html" class="hub-nav-btn">Infrastructure</a>
        <a href="dashboard.html" class="hub-nav-btn">Overview Dashboard</a>
        <a href="enrolment.html" class="hub-nav-btn">Enrolment Log</a>
        <a href="staff.html" class="hub-nav-btn">Manage Staff</a>
        <a href="student.html" class="hub-nav-btn">Manage Student</a>
        <a href="index.html" class="hub-nav-btn logout">Logout</a>
    </div>

    <div class="form-container">
        <div class="form-title">Basic School Master Profile Setup</div>
        
        <form id="basicSchoolForm">
            <div class="form-group">
                <label>MMDA Name</label>
                <input type="text" name="MMDA_Name" value="Ahafo Ano North Municipal Assembly" readonly>
            </div>

            <div class="form-group">
                <label>Name of School</label>
                <input type="text" name="School_Name" placeholder="Enter institutional official name" required>
            </div>
            
            <div class="form-group">
                <label>Circuit</label>
                <select name="Circuit" required>
                    <option value="" disabled selected>Select Circuit</option>
                    <option value="KOJOBETIAKO">KOJOBETIAKO</option>
                    <option value="AKWASIASE">AKWASIASE</option>
                    <option value="ANYINASUSO">ANYINASUSO</option>
                    <option value="DWAAHO">DWAAHO</option>
                    <option value="MANFO">MANFO</option>
                    <option value="SUBRISO">SUBRISO</option>
                    <option value="SUPONSO">SUPONSO</option>
                    <option value="TEPA URBAN A">TEPA URBAN A</option>
                    <option value="TEPA URBAN B">TEPA URBAN B</option>
                    <option value="TWABIDI">TWABIDI</option>
                </select>
            </div>

            <div class="form-group">
                <label>EMIS Code</label>
                <input type="text" name="EMIS_Code" placeholder="Enter 10-digit EMIS code" required>
            </div>

            <div class="form-group">
    <label>Name of School</label>
    <select name="School_Name" required>
        <option value="" disabled selected>Select Circuit First</option>
    </select>
</div>


            <div class="form-group">
                <label>School Model</label>
                <select name="School_Model" required>
                    <option value="" disabled selected>Select School Model</option>
                    <option value="Mainstream">Mainstream</option>
                    <option value="Integrated">Integrated</option>
                    <option value="Special">Special</option>
                    <option value="STEM Only">STEM Only</option>
                </select>
            </div>

            <div class="form-group">
                <label>Level</label>
                <select name="Level_Scope" required>
                    <option value="" disabled selected>Select Level Scope</option>
                    <option value="KG Only">KG Only</option>
                    <option value="Primary Only">Primary Only</option>
                    <option value="JHS Only">JHS Only</option>
                    <option value="KG and Primary">KG and Primary</option>
                    <option value="Primary and JHS">Primary and JHS</option>
                    <option value="KG, Primary and JHS">KG, Primary and JHS</option>
                </select>
            </div>
            <div class="form-group">
                <label>Affiliation Type</label>
                <select name="Affiliation_Type" required>
                    <option value="" disabled selected>Select Affiliation Type</option>
                    <option value="Public/non-religious (government)">Public/non-religious (government)</option>
                    <option value="Religious (missionary based faith)">Religious (missionary based faith)</option>
                    <option value="Private">Private</option>
                </select>
            </div>

            <div class="form-group">
                <label>Sector</label>
                <select name="Sector_Type" required>
                    <option value="" disabled selected>Select Sector</option>
                    <option value="Public">Public</option>
                    <option value="Private">Private</option>
                </select>
            </div>

            <div class="form-group">
                <label>Headteacher Name</label>
                <input type="text" name="Headteacher_Name" placeholder="First and last name">
            </div>

            <div class="form-group">
                <label>Headteacher Staff ID</label>
                <input type="text" name="Headteacher_Staff_ID" placeholder="e.g. TS-XXXXX">
            </div>

            <div class="form-group">
                <label>Headteacher Phone</label>
                <input type="text" name="Headteacher_Phone" placeholder="e.g. +233 XX XXX XXXX">
            </div>

            <div class="form-group">
                <label>Headteacher Email</label>
                <input type="email" name="Headteacher_Email" placeholder="e.g. headteacher@gmail.com">
            </div>

            <div class="form-group">
                <label>Area Type</label>
                <select name="Area_Type" required>
                    <option value="" disabled selected>Select Area Type</option>
                    <option value="Urban">Urban</option>
                    <option value="Peri-Urban">Peri-Urban</option>
                    <option value="Rural">Rural</option>
                </select>
            </div>

            <div class="form-group">
                <label>Location / Physical Address</label>
                <input type="text" name="Location_Address" placeholder="e.g. Off Tepa Main Road, Community 4">
            </div>
            
            <button type="submit" id="btnSave">Submit School Account</button>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("basicSchoolForm");
            const saveButton = document.getElementById("btnSave");

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                
                // UPDATE VALUE: Replace with your deployed Google Web App URL link
                const APP_SCRIPT_URL = "PASTE_YOUR_DEPLOYED_GOOGLE_WEB_APP_URL_HERE";
                
                saveButton.disabled = true;
                saveButton.innerText = "SUBMITTING...";

                const formData = new FormData(form);
                const payloadData = {};
                formData.forEach((val, key) => {
                    payloadData[key] = val;
                });

                const payload = {
                    formType: "Basic_School",
                    data: payloadData
                };

                try {
                    const res = await fetch(APP_SCRIPT_URL, {
                        method: "POST",
                        mode: "cors",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify(payload)
                    });
                    
                    const result = await res.json();
                    if (result.result === "success") {
                        alert(result.message);
                        form.reset();
                    } else {
                        alert("Database API Failure: " + result.message);
                    }
                } catch (err) {
                    console.error("API Gateway connectivity exception: ", err);
                    alert("Network Error: Unable to transmit data logs to your Google Sheets database engine.");
                } finally {
                    saveButton.disabled = false;
                    saveButton.innerText = "Submit School Account";
                }
            });
        });
    </script>
    
    <!-- Secure Central Session Access Protection Checkpoint -->
    <script src="session-manager.js"></script>
</body>
</html>
