<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GES - Basic Schools Register</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fff8f8; margin: 0; padding: 20px; }
        .hub-nav-bar { display: flex; gap: 8px; background-color: #800000; padding: 12px; border-radius: 6px; margin-bottom: 20px; }
        .hub-nav-btn { text-decoration: none; padding: 7px 14px; background-color: rgba(255,255,255,0.15); color: white; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .hub-nav-btn.active { background-color: white; color: #800000; }
        .form-container { background: white; padding: 20px; border: 1px solid #ebdcd0; border-radius: 8px; max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 12px; font-weight: bold; color: #333; }
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; background-color: #800000; color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="hub-nav-bar">
        <a href="school-basic.html" class="hub-nav-btn active">Basic Schools</a>
        <a href="school-second-cycle.html" class="hub-nav-btn">Second Cycle</a>
        <a href="school-infrastructure.html" class="hub-nav-btn">Infrastructure</a>
        <a href="dashboard.html" class="hub-nav-btn">Overview Dashboard</a>
        <a href="enrolment.html" class="hub-nav-btn">Enrolment Log</a>
        <a href="staff.html" class="hub-nav-btn">Manage Staff</a>
        <a href="student.html" class="hub-nav-btn">Manage Student</a>
        <a href="index.html" class="hub-nav-btn">Logout</a>
    </div>

    <div class="form-container">
        <h2>Basic School Master Profile Setup</h2>
        <form id="basicSchoolForm">
            <div class="form-group"><label>EMIS CODE</label><input type="text" name="EMIS_Code" value="1066340072"></div>
            <div class="form-group">
                <label>CIRCUIT</label>
                <select name="Circuit">
                    <option value="KOJOBETIAKO">KOJOBETIAKO</option><option value="AKWASIASE">AKWASIASE</option>
                    <option value="ANYINASUSO">ANYINASUSO</option><option value="MANFO">MANFO</option>
                </select>
            </div>
            <div class="form-group"><label>NAME OF SCHOOL</label><input type="text" name="School_Name" required></div>
            <div class="form-group"><label>LOCALITY / COMMMUNITY</label><input type="text" name="Locality" placeholder="Town Name"></div>
            <div class="form-group"><label>YEAR ESTABLISHED</label><input type="number" name="Year_Established" value="1995"></div>
            <div class="form-group"><label>HEADTEACHER FULL NAME</label><input type="text" name="Headteacher_Name"></div>
            <div class="form-group"><label>CONTACT TELEPHONE NUMBER</label><input type="text" name="Contact_Number"></div>
            <button type="submit" id="btnSave">SUBMIT SCHOOL ACCOUNT</button>
        </form>
    </div>

    <script>
        document.getElementById("basicSchoolForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("btnSave");
            btn.disabled = true; btn.innerText = "SAVING...";
            
            const APP_SCRIPT_URL = "PASTE_YOUR_DEPLOYED_WEB_APP_URL_HERE";
            const formData = new FormData(e.target);
            const payloadData = {};
            formData.forEach((val, key) => payloadData[key] = val);

            const payload = { formType: "Basic_School", data: payloadData };

            try {
                const res = await fetch(APP_SCRIPT_URL, { method: "POST", mode: "cors", body: JSON.stringify(payload) });
                const result = await res.json();
                if(result.result === "success") { alert(result.message); }
            } catch (err) { alert("API Post connection failure."); }
            finally { btn.disabled = false; btn.innerText = "SUBMIT SCHOOL ACCOUNT"; }
        });
    </script>
</body>
</html>
