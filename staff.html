<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GES Ahafo Ano North - Staff Register</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f9f6f0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .register-container {
            background: #ffffff;
            width: 100%;
            max-width: 1200px;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid #cccccc;
        }

        .header-title {
            text-align: center;
            color: #2b579a;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        /* Top Bar Layout styling */
        .top-bar {
            border: 2px solid #8b2500;
            padding: 12px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            background-color: #fafafa;
        }

        .top-input-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .top-input-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .top-input-group label {
            font-size: 11px;
            font-weight: bold;
            color: #333;
            width: 110px;
        }

        .top-input-group input {
            flex: 1;
            padding: 6px 8px;
            border: 1px solid #cccccc;
            outline: none;
            font-size: 12px;
        }

        /* Responsive Action Button Wrapping */
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }

        .btn {
            flex: 1;
            min-width: 85px;
            padding: 8px 4px;
            font-size: 11px;
            font-weight: bold;
            color: white;
            border: 1px solid #555555;
            cursor: pointer;
            border-radius: 3px;
            text-align: center;
        }
        .btn-save { background-color: #5cb85c; }
        .btn-new { background-color: #5bc0de; }
        .btn-update { background-color: #f0ad4e; }
        .btn-delete { background-color: #d9534f; }
        .btn-clear { background-color: #ffffff; color: #333; }
        .btn-back { background-color: #777777; }

        /* Mobile First Form Grid (Single Column) */
        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 20px;
        }

        fieldset {
            border: 2px solid #2b579a;
            border-radius: 6px;
            padding: 12px;
            background-color: #ffffff;
            width: 100%;
        }

        legend {
            font-size: 13px;
            font-weight: bold;
            color: #d9534f;
            padding: 0 6px;
        }

        .field-row {
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
            gap: 4px;
        }

        .field-row label {
            font-size: 11px;
            font-weight: bold;
            color: #444444;
            text-transform: uppercase;
        }

        .field-row input, .field-row select {
            width: 100%;
            padding: 8px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
            background-color: #ffffff;
        }

        .read-only-bg {
            background-color: #fff3cd !important;
        }

        .finance-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Bottom Search Components */
        .search-container {
            margin-top: 25px;
            border-top: 1px solid #cccccc;
            padding-top: 15px;
        }

        .search-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .search-bar input {
            flex: 1;
            padding: 8px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 13px;
        }

        .search-bar button {
            padding: 8px 12px;
            background-color: #2b579a;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th, .data-table td {
            border: 1px solid #2b579a;
            padding: 8px;
            text-align: left;
            font-size: 12px;
        }

        .data-table th {
            background-color: #fafafa;
            font-weight: bold;
        }

        /* Desktop Optimization Breakpoint */
        @media (min-width: 768px) {
            .padding { padding: 25px; }
            .header-title { font-size: 24px; }
            .top-bar { flex-direction: row; justify-content: space-around; }
            .top-input-container { flex-direction: row; }
            .action-buttons { flex-wrap: nowrap; }
            .form-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
            .full-width-section { grid-column: 1 / -1; }
            .field-row { flex-direction: row; align-items: center; }
            .field-row label { width: 150px; }
            .finance-row { flex-direction: row; }
            .employment-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        }
    </style>
</head>
<body>

    <div class="register-container">
        <div class="header-title">Staff Register</div>

        <form id="registerForm" onsubmit="event.preventDefault();">
            
            <div class="top-bar">
                <div class="top-input-container">
                    <div class="top-input-group">
                        <label>ACADEMIC YEAR</label>
                        <input type="text" placeholder="e.g. 2026/2027">
                    </div>
                    <div class="top-input-group">
                        <label>ACADEMIC TERM</label>
                        <input type="text" placeholder="e.g. Term 1">
                    </div>
                </div>

                <div class="action-buttons">
                    <button type="submit" class="btn btn-save" onclick="alert('Record Saved Successfully!')">SAVE</button>
                    <button type="button" class="btn btn-new" onclick="document.getElementById('registerForm').reset()">NEW</button>
                    <button type="button" class="btn btn-update" onclick="alert('Record Updated!')">UPDATE</button>
                    <button type="button" class="btn btn-delete" onclick="alert('Record Deleted!')">DELETE</button>
                    <button type="button" class="btn btn-clear" onclick="document.getElementById('registerForm').reset()">CLEAR</button>
                    <button type="button" class="btn btn-back" onclick="window.location.href='dashboard.html'">BACK</button>
                </div>
            </div>

            <div class="form-grid">
                
                <!-- Section 1: Personal Information -->
                <fieldset>
                    <legend>Personal Information</legend>
                    <div class="field-row"><label>Teacher ID</label><input type="text"></div>
                    <div class="field-row">
                        <label>Title</label>
                        <select><option></option><option>Mr.</option><option>Mrs.</option><option>Ms.</option><option>Dr.</option></select>
                    </div>
                    <div class="field-row"><label>Surname</label><input type="text"></div>
                    <div class="field-row"><label>Other Names</label><input type="text"></div>
                    <div class="field-row">
                        <label>Gender</label>
                        <select><option></option><option>Male</option><option>Female</option></select>
                    </div>
                    <div class="field-row"><label>Date of Birth</label><input type="date"></div>
                    <div class="field-row"><label>Age</label><input type="text" class="read-only-bg" placeholder="Auto-calculated"></div>
                    <div class="field-row">
                        <label>Religion</label>
                        <select><option></option><option>Christianity</option><option>Islam</option><option>Traditional</option></select>
                    </div>
                </fieldset>

                <!-- Section 2: Academic And School Details -->
                <fieldset>
                    <legend>Academic And School Details</legend>
                    <div class="field-row"><label>Circuit</label><select><option></option></select></div>
                    <div class="field-row"><label>Name of School</label><select><option></option></select></div>
                    <div class="field-row"><label>Association Type</label><select><option></option></select></div>
                    <div class="field-row"><label>Staff Type</label><select><option></option></select></div>
