<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GES Ahafo Ano North - Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f9f6f0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard-container {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(139, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .district-badge {
            display: inline-block;
            background-color: rgba(139, 0, 0, 0.08);
            color: #8b0000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 18px;
            color: #8b0000;
            font-weight: 700;
            margin-bottom: 5px;
            line-height: 1.3;
        }

        .header h2 {
            font-size: 15px;
            color: #333333;
            font-weight: 600;
        }

        /* Menu Grid Wrapper */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        /* Interactive Action Buttons */
        .menu-card {
            background-color: #fafafa;
            border: 1px solid #e0e0e0;
            padding: 18px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            width: 100%;
        }

        .menu-card:hover {
            border-color: #8b0000;
            background-color: rgba(139, 0, 0, 0.02);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 0, 0, 0.05);
        }

        .menu-info h3 {
            font-size: 16px;
            color: #8b0000;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .menu-info p {
            font-size: 13px;
            color: #666666;
        }

        .arrow-icon {
            color: #8b0000;
            font-weight: bold;
            font-size: 18px;
        }

        .btn-logout {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            background-color: #e0e0e0;
            color: #333333;
            transition: background-color 0.2s ease;
        }

        .btn-logout:hover {
            background-color: #d0d0d0;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            <span class="district-badge">GES Management Hub</span>
            <h1>AHAFO ANO NORTH EDUCATION DIRECTORATE</h1>
            <h2>Main Control Panel</h2>
        </div>

        <div class="menu-grid">
            <!-- Button 1: School Identification -->
            <button class="menu-card" onclick="alert('Navigating 
                <div class="menu-info">
                    <h3>School Identification</h3>
                    <p>Register and manage basic institute profile details</p>
                </div>
                <div class="arrow-icon">➔</div>
            </button>

            <!-- Button 2: Manage Staff -->
            <button class="menu-card" onclick="window.location.href='staff.html';">
                <div class="menu-info">
                    <h3>Manage Staff</h3>
                    <p>Track teachers, staff records, IDs, and allocations</p>
                </div>
                <div class="arrow-icon">➔</div>
            </button>

            <!-- Button 3: Manage Student -->
            <button class="menu-card" onclick="window.location.href='student.html';">
                <div class="menu-info">
                    <h3>Manage Student</h3>
                    <p>Update enrollment data, attendance, and registers</p>
                </div>
                <div class="arrow-icon">➔</div>
            </button>
        </div>

        <!-- Back/Logout Action -->
        <button type="button" class="btn-logout" onclick="window.location.href='index.html'">Logout</button>
    </div>

</body>
</html>
