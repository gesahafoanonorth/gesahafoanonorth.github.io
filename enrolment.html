<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GES - Basic Enrolment Ledger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="register-container">
    <div class="header-title">Basic Enrolment Log</div>

    <form id="enrolmentForm">
        <!-- Action Control Header -->
        <div class="top-bar">
            <div class="action-buttons">
                <button type="submit" class="btn btn-save-en">SAVE RECORD</button>
                <button type="button" class="btn btn-back-en" onclick="window.location.href='dashboard.html'">BACK</button>
            </div>
        </div>

        <!-- METADATA INFORMATION BAR -->
        <fieldset class="meta-fieldset">
            <div class="meta-grid">
                <div>
                    <div class="field-row"><label>ACADEMIC YEAR</label><input type="text" value="2026/27" name="academicYear" required></div>
                    <div class="field-row"><label>ACADEMIC TERM</label><input type="text" value="FIRST TERM" name="academicTerm" required></div>
                    <div class="field-row">
                        <label>Select LEVEL</label>
                        <select name="selectLevel" required>
                            <option value="KG, PRIMARY AND JHS" selected>KG, PRIMARY AND JHS</option>
                        </select>
                    </div>
                </div>
                <div>
                    <div class="field-row"><label>EMIS CODE</label><input type="text" name="emisCode" value="1066340072" required></div>
                    <div class="field-row"><label>CIRCUIT</label><input type="text" name="circuit" value="KOJOBETIAKO" required></div>
                    <div class="field-row"><label>NAME OF SCHOOL</label><input type="text" name="schoolName" value="ABONSUASO M/A JHS" required></div>
                </div>
            </div>
        </fieldset>

        <!-- MODULE 1: KG ENROLMENT -->
        <fieldset class="kg-fieldset">
            <legend>KG Enrolment</legend>
            <div class="stage-row-grid">
                <!-- KG 1 -->
                <div class="inner-class-card">
                    <h4>KG 1</h4>
                    <div class="sub-input-row"><label>BOYS</label><input type="number" min="0" value="0" id="kg1_b" name="kg1_b"></div>
                    <div class="sub-input-row"><label>GIRLS</label><input type="number" min="0" value="0" id="kg1_g" name="kg1_g"></div>
                    <div class="sub-input-row"><label>TOTAL</label><input type="text" class="read-only-bg" id="kg1_t" readonly value="0"></div>
                </div>
                <!-- KG 2 -->
                <div class="inner-class-card">
                    <h4>KG 2</h4>
                    <div class="sub-input-row"><label>BOYS</label><input type="number" min="0" value="0" id="kg2_b" name="kg2_b"></div>
                    <div class="sub-input-row"><label>GIRLS</label><input type="number" min="0" value="0" id="kg2_g" name="kg2_g"></div>
                    <div class="sub-input-row"><label>TOTAL</label><input type="text" class="read-only-bg" id="kg2_t" readonly value="0"></div>
                </div>
                <!-- KG GRANDTOTAL -->
                <div class="inner-class-card total-card-kg">
                    <h4>GRANDTOTAL</h4>
                    <div class="sub-input-row"><label>BOYS</label><input type="text" class="read-only-bg" id="kg_gt_b" readonly value="0"></div>
                    <div class="sub-input-row"><label>GIRLS</label><input type="text" class="read-only-bg" id="kg_gt_g" readonly value="0"></div>
                    <div class="sub-input-row"><label>TOTAL</label><input type="text" class="read-only-bg summary-highlight" id="kg_gt_t" readonly value="0"></div>
                </div>
            </div>
        </fieldset>

        <!-- MODULE 2: PRIMARY ENROLMENT -->
        <fieldset class="primary-fieldset">
            <legend>Primary Enrolment</legend>
            
            <!-- Row One: P1, P2, P3 -->
            <div class="stage-row-grid">
                <div class="inner-class-card">
                    <h4>PRIMARY 1</h4>
                    <div class="sub-input-row"><label>BOYS</label><input type="number" min="0" value="0" id="p1_b" name="p1_b"></div>
                    <div class="sub-input-row"><label>GIRLS</label><input type="number" min="0" value="0" id="p1_g" name="p1_g"></div>
                    <div class="sub-input-row"><label>TOTAL</label><input type="text" class="read-only-bg" id="p1_t" readonly value="0"></div>
                </div>
                <div class="inner-class-card">
                    <h4>PRIMARY 2</h4>
                    <div class="sub-input-row"><label>BOYS</label><input type="number" min="0" value="0" id="p2_b" name="p2_b"></div>
                    <div class="sub-input-row"><label>GIRLS</label><input type="number" min="0" value="0" id="p2_g" name="p2_g"></div>
                    <div class="sub-input-row"><label>TOTAL</label><input type="text" class="read-only-bg" id="p2_t" readonly value="0"></div>
                </div>
                <div class="inner-class-card">
                    <h4>PRIMARY 3</h4>
                    <div class="sub-input-row"><label>BOYS</label><input type="number" min="0" value="0" id="p3_b" name="p3_b"></div>
                    <div class="sub-input-row"><label>GIRLS</label><input type="number" min="0" value="0" id="p3_g" name="p3_g"></div>
                    <div class="sub-input-row"><label>TOTAL</label><input type="text" class="read-only-bg" id="p3_t" readonly value="0"></div>
                </div>
            </div>

            <!-- Row Two: P4, P5, P6 -->
            <div class="stage-row-grid grid-spacer">
                <div class="inner-class-card">
                    <h4>PRIMARY 4</h4>
                    <div class="sub-input-row"><label>BOYS</label><input type="number" min="0" value="0" id="p4_b" name="p4_b"></div>
                    <div class="sub-input-row"><label>GIRLS</label><input type="number" min="0" value="0" id="p4_g" name="p4_g"></div>
                    <div class="sub-input-row"><label>TOTAL</label><input type="text" class="read-only-bg" id="p4_t" readonly value="0"></div>
                </div>
                <div class="inner-class-card">
                    <h4>PRIMARY 5</h4>
                    <div class="sub-input-row"><label>BOYS</label><input type="number" min="0" value="0" id="p5_b" name="p5_b"></div>
                    <div class="sub-input-row"><label>GIRLS</label><input type="number" min="0" value="0" id="p5_g" name="p5_g"></div>
                    <div class="sub-input-row"><label>TOTAL</label><input type="text" class="read-only-bg" id="p5_t" readonly value="0"></div>
                </div>
                <div class="inner-class-card">
                    <h4>PRIMARY 6</h4>
                    <div class="sub-input-row"><label>BOYS</label><input type="number" min="0" value="0" id="p6_b" name="p6_b"></div>
                    <div class="sub-input-row"><label>GIRLS</label><input type="number" min="0" value="0" id="p6_g" name="p6_g"></div>
                    <div class="sub-input-row"><label>TOTAL</label><input type="text" class="read-only-bg" id="p6_t" readonly value="0"></div>
                </div>
            </div>

            <!-- Row Three: Primary Grand Total -->
            <div class="stage-row-grid grid-spacer">
                <div></div>
                <div></div>
                <div class="inner-class-card total-card-primary">
                    <h4>PRIMARY GRANDTOTAL</h4>
                    <div class="sub-input-row"><label>BOYS</label><input type="text" class="read-only-bg" id="p_gt_b" readonly value="0"></div>
                    <div class="sub-input-row"><label>GIRLS</label><input type="text" class="read-only-bg" id="p_gt_g" readonly value="0"></div>
                    <div class="sub-input-row"><label>TOTAL</label><input type="text" class="read-only-bg summary-highlight" id="p_gt_t" readonly value="0"></div>
                </div>
            </div>
        </fieldset>

        <!-- MODULE 3: JHS ENROLMENT -->
        <fieldset class="jhs-fieldset">
            <legend>JHS Enrolment</legend>
            <div class="stage-row-grid">
                <div class="inner-class-card">
                    <h4>JHS 1</h4>
                    <div class="sub-input-row"><label>BOYS</label><input type="number" min="0" value="0" id="jhs1_b" name="jhs1_b"></div>
                    <div class="sub-input-row"><label>GIRLS</label><input type="number" min="0" value="0" id="jhs1_g" name="jhs1_g"></div>
                    <div class="sub-input-row"><label>TOTAL</label><input type="text" class="read-only-bg" id="jhs1_t" readonly value="0"></div>
                </div>
                <div class="inner-class-card">
                    <h4>JHS 2</h4>
                    <div class="sub-input-row"><label>BOYS</label><input type="number" min="0" value="0" id="jhs2_b" name="jhs2_b"></div>
                    <div class="sub-input-row"><label>GIRLS</label><input type="number" min="0" value="0" id="jhs2_g" name="jhs2_g"></div>
                    <div class="sub-input-row"><label>TOTAL</label><input type="text" class="read-only-bg" id="jhs2_t" readonly value="0"></div>
                </div>
                <div class="inner-class-card">
                    <h4>JHS 3</h4>
                    <div class="sub-input-row"><label>BOYS</label><input type="number" min="0" value="0" id="jhs3_b" name="jhs3_b"></div>
                    <div class="sub-input-row"><label>GIRLS</label><input type="number" min="0" value="0" id="jhs3_g" name="jhs3_g"></div>
                    <div class="sub-input-row"><label>TOTAL</label><input type="text" class="read-only-bg" id="jhs3_t" readonly value="0"></div>
                </div>
            </div>
