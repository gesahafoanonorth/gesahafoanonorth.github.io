<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic School Master Records</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://jsdelivr.net"></script>
  <style>
    /* Exact UI color matching definitions */
    :root {
      --ges-red: #8B0000;      /* Deep primary administrative red */
      --ges-dark-red: #700000; /* Hover state red */
      --ges-gray: #6B7280;     /* Border gray */
      --ges-charcoal: #5A5A5A; /* Back button color */
    }
  </style>
</head>
<body class="bg-[#FAF8F5] min-h-screen p-4 font-sans text-gray-800">

  <div class="max-w-md mx-auto bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden">
    
    <!-- Action Control Headers -->
    <div class="p-4 space-y-2 bg-[#FAF8F5] border-b border-gray-200">
      <button type="button" onclick="saveRecord()" class="w-full text-center bg-[#8B0000] hover:bg-[#700000] text-white font-bold py-3 px-4 rounded shadow-sm tracking-wide uppercase text-sm transition-colors cursor-pointer">
        Save Record
      </button>
      <button type="button" onclick="window.location.href='dashboard.html'" class="w-full text-center bg-[#5A5A5A] hover:bg-[#4A4A4A] text-white font-bold py-3 px-4 rounded shadow-sm tracking-wide uppercase text-sm transition-colors cursor-pointer">
        Back
      </button>
    </div>

    <!-- Master Form Entry -->
    <form id="schoolBasicForm" class="p-4 space-y-6">

      <!-- SECTION 1: SCHOOL INFO & EMIS -->
      <fieldset class="border border-[#8B0000] rounded-md p-4 pt-2 relative">
        <legend class="text-xs font-bold tracking-wider text-[#8B0000] px-2 uppercase bg-white ml-2">
          School Info & EMIS
        </legend>
        
        <div class="space-y-4 mt-2">
          <!-- 1. MMDA Name -->
          <div class="flex flex-col">
            <label class="text-xs font-bold text-gray-700 uppercase mb-1">1. MMDA Name</label>
            <input type="text" id="mmdaName" value="Ahafo Ano North Municipal" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#8B0000]" required>
          </div>

          <!-- 2. School Name -->
          <div class="flex flex-col">
            <label class="text-xs font-bold text-gray-700 uppercase mb-1">2. School Name</label>
            <input type="text" id="schoolName" placeholder="Official Institution Name" class="w-full border border-gray-300 rounded px-3 py-2 text-sm placeholder-gray-400 focus:outline-none focus:border-[#8B0000]" required>
          </div>

          <!-- 3. Circuit -->
          <div class="flex flex-col">
            <label class="text-xs font-bold text-gray-700 uppercase mb-1">3. Circuit</label>
            <input type="text" id="circuit" placeholder="As designated" class="w-full border border-gray-300 rounded px-3 py-2 text-sm placeholder-gray-400 focus:outline-none focus:border-[#8B0000]" required>
          </div>

          <!-- 4. School EMIS Code -->
          <div class="flex flex-col">
            <label class="text-xs font-bold text-gray-700 uppercase mb-1">4. School EMIS Code</label>
            <input type="text" id="emisCode" pattern="[0-9]+" placeholder="Numbers only" class="w-full border border-gray-300 rounded px-3 py-2 text-sm placeholder-gray-400 focus:outline-none focus:border-[#8B0000]" required>
          </div>

          <!-- 5. School Email -->
          <div class="flex flex-col">
            <label class="text-xs font-bold text-gray-700 uppercase mb-1">5. School Email</label>
            <input type="email" id="schoolEmail" placeholder="e.g. school@ges.gov.gh" class="w-full border border-gray-300 rounded px-3 py-2 text-sm placeholder-gray-400 focus:outline-none focus:border-[#8B0000]">
          </div>
        </div>
      </fieldset>


      <!-- SECTION 2: MODEL & OPERATIONAL LEVEL -->
      <fieldset class="border border-[#8B0000] rounded-md p-4 pt-2 relative">
        <legend class="text-xs font-bold tracking-wider text-[#8B0000] px-2 uppercase bg-white ml-2">
          Model & Operational Level
        </legend>
        
        <div class="space-y-4 mt-2">
          <!-- 6. School Model -->
          <div class="flex flex-col">
            <label class="text-xs font-bold text-gray-700 uppercase mb-1">6. School Model</label>
            <select id="schoolModel" class="w-full border border-gray-300 bg-[#F3F4F6] rounded px-3 py-2 text-sm text-gray-600 focus:outline-none focus:border-[#8B0000]" required>
              <option value="" disabled selected>-- Select Model --</option>
              <option value="Mainstream">Mainstream</option>
              <option value="Integrated">Integrated</option>
              <option value="Special">Special</option>
              <option value="STEM Only">STEM Only</option>
            </select>
          </div>

          <!-- 7. Level -->
          <div class="flex flex-col">
            <label class="text-xs font-bold text-gray-700 uppercase mb-1">7. Level</label>
            <select id="schoolLevel" class="w-full border border-gray-300 bg-[#F3F4F6] rounded px-3 py-2 text-sm text-gray-600 focus:outline-none focus:border-[#8B0000]" required>
              <option value="" disabled selected>-- Select Level --</option>
              <option value="KG Only">KG Only</option>
              <option value="Primary Only">Primary Only</option>
              <option value="JHS Only">JHS Only</option>
              <option value="KG & Primary">KG & Primary</option>
              <option value="KG & JHS">KG & JHS</option>
              <option value="Primary & JHS">Primary & JHS</option>
              <option value="Basic (KG, Primary & JHS)">Basic (KG, Primary & JHS)</option>
            </select>
          </div>

          <!-- 8. Affiliation Type -->
          <div class="flex flex-col">
            <label class="text-xs font-bold text-gray-700 uppercase mb-1">8. Affiliation Type</label>
            <select id="affiliationType" class="w-full border border-gray-300 bg-[#F3F4F6] rounded px-3 py-2 text-sm text-gray-600 focus:outline-none focus:border-[#8B0000]" required>
              <option value="" disabled selected>-- Select Affiliation --</option>
              <option value="Public/Non-Religious">Public/Non-Religious (Government)</option>
              <option value="Religious">Religious (Mission/Faith-Based)</option>
              <option value="Private">Private (Non-Religious)</option>
            </select>
          </div>
        </div>
      </fieldset>

    </form>
  </div>

  <script>
    function saveRecord() {
      const form = document.getElementById('schoolBasicForm');
      
      // Perform structural HTML5 validation checks
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      // Consolidate UI elements into data payloads
      const recordData = {
        mmdaName: document.getElementById('mmdaName').value,
        schoolName: document.getElementById('schoolName').value,
        circuit: document.getElementById('circuit').value,
        emisCode: document.getElementById('emisCode').value,
        schoolEmail: document.getElementById('schoolEmail').value,
        schoolModel: document.getElementById('schoolModel').value,
        schoolLevel: document.getElementById('schoolLevel').value,
        affiliationType: document.getElementById('affiliationType').value,
        timestamp: new Date().toISOString()
      };

      console.log('Saving Record to System Repository:', recordData);
      alert('Record data captured successfully! Ready for verification sync.');
    }
  </script>
</body>
</html>
