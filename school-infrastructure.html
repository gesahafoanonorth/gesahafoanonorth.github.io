<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GES - School Infrastructure Registry</title>
  <!-- Tailwind CSS v4 CDN Engine Import -->
  <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-[#FAF6F0] min-h-screen p-4 md:p-8 font-sans text-gray-800 flex justify-center items-start">

  <!-- MASTER ENTRY FORM CONTAINER -->
  <div class="w-full max-w-7xl bg-white p-4 md:p-8 rounded-md shadow-sm border border-gray-300">
    
    <!-- CENTER MAIN HEADER BANNER -->
    <div class="text-center text-[#8B0000] text-xl md:text-2xl font-bold tracking-wide uppercase mb-6">
      School Infrastructure & Logistics Profiling
    </div>
    
    <form id="infrastructureForm" onsubmit="event.preventDefault(); alert('Infrastructure profile saved successfully!');">
      
      <!-- TOP CONTROL ACTION BAR -->
      <div class="border border-[#8B0000] p-4 rounded-md flex flex-col sm:flex-row sm:justify-end gap-3 mb-8 bg-transparent">
        <button type="submit" class="w-full sm:w-auto bg-[#8B0000] hover:bg-[#700000] text-white font-bold py-2 px-8 rounded tracking-wide uppercase text-xs transition-colors cursor-pointer">
          Save Record
        </button>
        <button type="button" onclick="window.location.href='dashboard.html'" class="w-full sm:w-auto bg-[#5A5C5E] hover:bg-[#454749] text-white font-bold py-2 px-8 rounded tracking-wide uppercase text-xs transition-colors cursor-pointer">
          Back
        </button>
      </div>

      <!-- MAIN MULTI-COLUMN LAYOUT GRID -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- BLOCK 1: GENERAL SCHOOL PROFILE -->
        <fieldset class="border border-[#8B0000] rounded-md p-5 pt-3 bg-white">
          <legend class="text-xs font-bold tracking-wider text-[#8B0000] px-2 uppercase bg-white ml-2">
            General School Profile
          </legend>
          <div class="space-y-3 mt-2">
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">INFRAID</label>
              <input type="text" placeholder="(System Generated)" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm bg-gray-100 text-gray-600 focus:outline-none" readonly>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">EMIS Code</label>
              <input type="text" id="emisCode" placeholder="Enter School EMIS Code" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-[#8B0000]" required>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">Circuit</label>
              <select id="circuit" class="flex-1 border border-gray-300 bg-white rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-[#8B0000]" required>
                <option value="" disabled selected>-- Select Circuit --</option>
                <option value="AKWASIASE">AKWASIASE</option>
                <option value="ANYINASUSO">ANYINASUSO</option>
                <option value="DWAAHO">DWAAHO</option>
                <option value="KOJOBETIAKO">KOJOBETIAKO</option>
                <option value="MANFO">MANFO</option>
                <option value="SUBRISO">SUBRISO</option>
                <option value="SUPONSO">SUPONSO</option>
                <option value="TEPA URBAN A">TEPA URBAN A</option>
                <option value="TEPA URBAN B">TEPA URBAN B</option>
                <option value="TWABIDI">TWABIDI</option>
              </select>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">Name of Institution</label>
              <input type="text" id="schoolName" placeholder="Enter Official Institution Name" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-[#8B0000]" required>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">School Status</label>
              <select id="schoolStatus" class="flex-1 border border-gray-300 bg-white rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-[#8B0000]" required>
                <option value="" disabled selected>-- Select Status --</option>
                <option value="Public">Public</option>
                <option value="Private">Private</option>
              </select>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">School Levels</label>
              <select class="flex-1 border border-gray-300 bg-white rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-[#8B0000]">
                <option value="">-- Select Levels --</option>
                <option value="JHS">JHS Only</option>
                <option value="Primary-JHS">Primary & JHS</option>
              </select>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">WAEC Code</label>
              <input type="text" placeholder="Enter WAEC Code" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-[#8B0000]">
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">Year Established</label>
              <input type="number" placeholder="YYYY" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-[#8B0000]">
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">School Category</label>
              <input type="text" placeholder="Category" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-[#8B0000]">
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">School Reemeals Availability</label>
              <select class="flex-1 border border-gray-300 bg-white rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-[#8B0000]">
                <option value="">-- Select --</option>
                <option value="Yes">Available</option>
                <option value="No">Not Available</option>
              </select>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">GALOP</label>
              <select class="flex-1 border border-gray-300 bg-white rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-[#8B0000]">
                <option value="">-- Select --</option>
                <option value="Beneficiary">Beneficiary</option>
                <option value="Non-Beneficiary">Non-Beneficiary</option>
              </select>
            </div>
          </div>
        </fieldset>
        <!-- BLOCK 2: MANAGEMENT & LOCALITY DETAILS -->
        <fieldset class="border border-[#8B0000] rounded-md p-5 pt-3 bg-white">
          <legend class="text-xs font-bold tracking-wider text-[#8B0000] px-2 uppercase bg-white ml-2">
            Management & Locality Details
          </legend>
          <div class="space-y-3 mt-2">
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">Name of Headteacher</label>
              <input type="text" id="headName" placeholder="Enter Full Name" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-[#8B0000]" required>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">Headteacher Contact</label>
              <input type="tel" id="headContact" placeholder="Enter Contact Number" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-[#8B0000]" required>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">Education Management</label>
              <input type="text" placeholder="e.g. Public / Mission" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-[#8B0000]">
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">Locality</label>
              <input type="text" placeholder="Town or Community Name" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-[#8B0000]">
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">Type of Locality</label>
              <select class="flex-1 border border-gray-300 bg-white rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-[#8B0000]">
                <option value="">-- Select Type --</option>
                <option value="Urban">Urban</option>
                <option value="Peri-Urban">Peri-Urban</option>
                <option value="Rural">Rural</option>
              </select>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">School Address</label>
              <input type="text" placeholder="P.O. Box / Postal Address" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-[#8B0000]">
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">School E-Mail</label>
              <input type="email" placeholder="e.g. school@ges.gov.gh" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-[#8B0000]">
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">GPS Address</label>
              <input type="text" placeholder="e.g. AK-123-4567" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-[#8B0000]">
            </div>
          </div>
        </fieldset>

        <!-- BLOCK 3: UTILITIES & ENVIRONMENTAL ACCESS -->
        <fieldset class="border border-[#8B0000] rounded-md p-5 pt-3 bg-white">
          <legend class="text-xs font-bold tracking-wider text-[#8B0000] px-2 uppercase bg-white ml-2">
            Utilities & Environmental Access
          </legend>
          <div class="space-y-3 mt-2">
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">Vehicle Accessibility</label>
              <select class="flex-1 border border-gray-300 bg-white rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-[#8B0000]">
                <option value="">-- Select --</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">Type of Road</label>
              <select class="flex-1 border border-gray-300 bg-white rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-[#8B0000]">
                <option value="">-- Select --</option>
                <option value="Tarred">Tarred</option>
                <option value="Murt">Murt / Earth Road</option>
              </select>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">Wired for Electricity</label>
              <select class="flex-1 border border-gray-300 bg-white rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-[#8B0000]">
                <option value="">-- Select --</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">Electricity Functional</label>
              <select class="flex-1 border border-gray-300 bg-white rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-[#8B0000]">
                <option value="">-- Select --</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">Main Source of Water</label>
              <select class="flex-1 border border-gray-300 bg-white rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-[#8B0000]">
                <option value="">-- Select --</option>
                <option value="Borehole">Borehole</option>
                <option value="Pipe-borne">Pipe-borne</option>
                <option value="River/Stream">River / Stream</option>
              </select>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">Water Storage Facility</label>
              <select class="flex-1 border border-gray-300 bg-white rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-[#8B0000]">
                <option value="">-- Select --</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">Main Toilet Facility</label>
              <select class="flex-1 border border-gray-300 bg-white rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-[#8B0000]">
                <option value="">-- Select --</option>
                <option value="KVIP">KVIP</option>
                <option value="Water Closet">Water Closet</option>
                <option value="Pit Latrine">Pit Latrine</option>
              </select>
            </div>
          </div>
        </fieldset>

               <!-- BLOCK 4: LABORATORIES & SPECIAL FACILITIES -->
        <fieldset class="border border-[#8B0000] rounded-md p-5 pt-3 bg-white">
          <legend class="text-xs font-bold tracking-wider text-[#8B0000] px-2 uppercase bg-white ml-2">
            Laboratories & Special Facilities
          </legend>
          <div class="space-y-3 mt-2">
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">Computer Lab</label>
              <select class="flex-1 border border-gray-300 bg-white rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-[#8B0000]">
                <option value="" disabled selected>-- Select --</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">Science Lab</label>
              <select class="flex-1 border border-gray-300 bg-white rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-[#8B0000]">
                <option value="" disabled selected>-- Select --</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">Headquarters Available</label>
              <select class="flex-1 border border-gray-300 bg-white rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-[#8B0000]">
                <option value="" disabled selected>-- Select --</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
              <label class="w-full md:w-44 text-xs font-bold text-gray-700 uppercase flex-shrink-0">Playground</label>
              <select class="flex-1 border border-gray-300 bg-white rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-[#8B0000]">
                <option value="" disabled selected>-- Select --</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>
          </div>
        </fieldset>
<!-- BLOCK 5: STRUCTURAL ROOM TALLIES -->
        <fieldset class="border border-[#8B0000] rounded-md p-5 pt-3 bg-white">
          <legend class="text-xs font-bold tracking-wider text-[#8B0000] px-2 uppercase bg-white ml-2">
            Structural Room Tallies
          </legend>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-2">
            <div class="flex flex-col"><label class="text-[10px] font-bold text-gray-600 mb-1">NUM CLASS UNDER TREE</label><input type="number" min="0" value="0" class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-[#8B0000]"></div>
            <div class="flex flex-col"><label class="text-[10px] font-bold text-gray-600 mb-1">NUM OF PERMANENT CLASSROOM</label><input type="number" min="0" value="0" class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-[#8B0000]"></div>
            <div class="flex flex-col"><label class="text-[10px] font-bold text-gray-600 mb-1">NUM OF TEMPORARY CLASSROOM</label><input type="number" min="0" value="0" class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-[#8B0000]"></div>
            <div class="flex flex-col"><label class="text-[10px] font-bold text-gray-600 mb-1">NUM OF UNCOMPLETED CLASSROOM</label><input type="number" min="0" value="0" class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-[#8B0000]"></div>
            <div class="flex flex-col"><label class="text-[10px] font-bold text-gray-600 mb-1">NUMBER OF OFFICE</label><input type="number" min="0" value="0" class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-[#8B0000]"></div>
            <div class="flex flex-col"><label class="text-[10px] font-bold text-gray-600 mb-1">NUMBER OF LIBRARY</label><input type="number" min="0" value="0" class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-[#8B0000]"></div>
            <div class="flex flex-col"><label class="text-[10px] font-bold text-gray-600 mb-1">NUMBER OF STAFF ROOM</label><input type="number" min="0" value="0" class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-[#8B0000]"></div>
            <div class="flex flex-col"><label class="text-[10px] font-bold text-gray-600 mb-1">NUMBER OF STOREROOM</label><input type="number" min="0" value="0" class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-[#8B0000]"></div>
            <div class="flex flex-col sm:col-span-2"><label class="text-[10px] font-bold text-gray-600 mb-1">NUMBER OF TEACHERS QUARTERS</label><input type="number" min="0" value="0" class="w-full border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-[#8B0000]"></div>
          </div>
        </fieldset>

        <!-- BLOCK 6: ASSET INVENTORY & LOGBOOKS -->
        <fieldset class="border border-[#8B0000] rounded-md p-5 pt-3 bg-white">
          <legend class="text-xs font-bold tracking-wider text-[#8B0000] px-2 uppercase bg-white ml-2">
            Asset Inventory & Logbooks
          </legend>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-2">
            <div class="flex flex-col"><label class="text-[10px] font-bold text-gray-600 mb-1">INVENTORY</label><input type="text" placeholder="Status" class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-[#8B0000]"></div>
            <div class="flex flex-col"><label class="text-[10px] font-bold text-gray-600 mb-1">TEACHER ATTENDANCE BOOK</label><input type="text" placeholder="Status" class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-[#8B0000]"></div>
            <div class="flex flex-col"><label class="text-[10px] font-bold text-gray-600 mb-1">CLASS REGISTER</label><input type="text" placeholder="Status" class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-[#8B0000]"></div>
            <div class="flex flex-col"><label class="text-[10px] font-bold text-gray-600 mb-1">LOGBOOK</label><input type="text" placeholder="Status" class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-[#8B0000]"></div>
            <div class="flex flex-col"><label class="text-[10px] font-bold text-gray-600 mb-1">VISITORS BOOK</label><input type="text" placeholder="Status" class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-[#8B0000]"></div>
            <div class="flex flex-col"><label class="text-[10px] font-bold text-gray-600 mb-1">PRINTERS</label><input type="text" placeholder="Status" class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-[#8B0000]"></div>
            <div class="flex flex-col"><label class="text-[10px] font-bold text-gray-600 mb-1">NUMBER OF LAPTOP</label><input type="number" min="0" value="0" class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-[#8B0000]"></div>
            <div class="flex flex-col"><label class="text-[10px] font-bold text-gray-600 mb-1">NUMBER OF DESKTOP COMPUTER</label><input type="number" min="0" value="0" class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-[#8B0000]"></div>
            <div class="flex flex-col"><label class="text-[10px] font-bold text-gray-600 mb-1">FINANCIAL RECORD BOOK</label><input type="text" placeholder="Status" class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-[#8B0000]"></div>
            <div class="flex flex-col"><label class="text-[10px] font-bold text-gray-600 mb-1">STAFF MOVEMENT BOOK</label><input type="text" placeholder="Status" class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-[#8B0000]"></div>
