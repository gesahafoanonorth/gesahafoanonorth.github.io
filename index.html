<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GES Ahafo Ano North - Login Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f4f8; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(10, 60, 155, 0.1); 
            border: 1px solid rgba(10, 60, 155, 0.1); 
        }

        .logo-wrapper {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-wrapper img {
            width: 150px; 
            height: auto; 
            max-width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 18px;
            color: #0A3C9B; 
            font-weight: 700;
            line-height: 1.3;
        }

        .header p {
            font-size: 14px;
            color: #666666;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333333;
            margin-bottom: 6px;
        }

        .form-group label span {
            color: #d9534f;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            outline: none;
            background-color: #fafafa;
            transition: all 0.2s ease;
        }

        /* Added padding on the right to make room for the toggle button */
        .password-input-wrapper input {
            padding-right: 45px;
        }

        .form-group input:focus {
            border-color: #0A3C9B; 
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(10, 60, 155, 0.15);
        }

        /* Styling for the wrapper and toggle visibility button */
        .password-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: #666666;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            padding: 4px;
            user-select: none;
            text-transform: uppercase;
        }

        .toggle-password:hover {
            color: #0A3C9B;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #0A3C9B; 
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #072a6b;
        }

        .footer-links {
            margin-top: 25px;
            text-align: center;
            font-size: 13px;
        }

        .footer-links a {
            color: #0A3C9B;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .district-badge {
            display: inline-block;
            background-color: rgba(10, 60, 155, 0.08);
            color: #0A3C9B;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-wrapper">
            <img src="Logo.png" alt="Ahafo Ano North Municipal Education Directorate Logo">
        </div>

        <div class="header">
            <span class="district-badge">GES District Portal</span>
            <h1>AHAFO ANO NORTH EDUCATION DIRECTORATE</h1>
            <p>Sign in to access your MMDA dashboard</p>
        </div>

        <form action="#" method="POST" onsubmit="
            event.preventDefault(); 
            const code = document.getElementById('emis-code').value; 
            const pass = document.getElementById('password').value; 
            if(code === 'ADMIN' && pass === '123456') { 
                window.location.href='dashboard.html'; 
            } else { 
                alert('Invalid EMIS Code or Password. Please try again.'); 
            }
        ">
            <div class="form-group">
                <label for="emis-code">EMIS Code<span>*</span></label>
                <input type="text" id="emis-code" placeholder="Enter your official code" required>
            </div>

            <div class="form-group">
                <label for="password">Password <span>*</span></label>
                <!-- Updated: Wrapped input in a container and added a toggle button -->
                <div class="password-input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <button type="button" id="togglePasswordBtn" class="toggle-password">Show</button>
                </div>
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <div class="footer-links">
            <p><a href="#">Forgot Password?</a></p>
            <p style="margin-top: 10px; color: #888888; font-size: 11px;">Official Ghana Education Service Gateway</p>
        </div>
    </div>

    <!-- Script to toggle the password field type -->
    <script>
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePasswordBtn');

        toggleBtn.addEventListener('click', function() {
            // Check current input type
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = 'Hide';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = 'Show';
            }
        });
    </script>

</body>
</html>
