<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GES - Basic Enrolment</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .register-container * { color: #333333 !important; }
        .action-buttons button { color: #ffffff !important; }
        fieldset { border: 2px solid #22b14c; border-radius: 6px; padding: 15px; margin-bottom: 20px; }
        legend { font-weight: bold; color: #22b14c !important; padding: 0 6px; }
        .btn-save-en { background-color: #22b14c !important; }
        .btn-back-en { background-color: #777777 !important; }
        .enrol-inline { display: flex; gap: 10px; margin-bottom: 8px; }
        .enrol-inline input { flex: 1; text-align: center; }
    </style>
</head>
<body>

<div class="register-container">
    <div class="header-title" style="color: #22b14c !important;">Basic Enrolment Data</div>
    
    <form id="enrolmentForm" onsubmit="event.preventDefault(); alert('Enrolment Data validated successfully!'); window.location.href='dashboard.html';">
        <div class="top-bar" style="border-color: #22b14c;">
            <div class="action-buttons">
                <button type="submit" class="btn btn-save-en">SAVE RECORD</button>
                <button type="button" class="btn btn-back-en" onclick="window.location.href='dashboard.html'">BACK</button>
            </div>
        </div>

        <div class="form-grid">
            <!-- Setup Block -->
            <fieldset style="border-color: #cccccc;">
                <legend style="color: #666666 !important;">Academic & School Identification</legend>
                <div class="field-row"><label>Academic Year</label><input type="text" value="2026/2027" required></div>
                <div class="field-row"><label>School EMIS Code</label><input type="text" pattern="[0-9]*" required></div>
                <div class="field-row"><label>Official School Name</label><input type="text" required></div>
            </fieldset>

            <!-- KG Box -->
            <fieldset>
                <legend>KG Population Summary</legend>
                <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 4px;">KG 1 (Boys / Girls)</label>
                <div class="enrol-inline">
                    <input type="number" placeholder="Boys Count" min="0" required>
                    <input type="number" placeholder="Girls Count" min="0" required>
                </div>
                <label style="font-size: 12px; font-weight: bold; display: block; margin-top: 10px; margin-bottom: 4px;">KG 2 (Boys / Girls)</label>
                <div class="enrol-inline">
                    <input type="number" placeholder="Boys Count" min="0" required>
                    <input type="number" placeholder="Girls Count" min="0" required>
                </div>
            </fieldset>

            <!-- Primary Box -->
            <fieldset style="border-color: #ffc90e;">
                <legend style="color: #ffc90e !important;">Primary Class Logs</legend>
                <div class="field-row"><label>Primary 1 Total</label><input type="number" min="0" required></div>
                <div class="field-row"><label>Primary 2 Total</label><input type="number" min="0" required></div>
                <div class="field-row"><label>Primary 3 Total</label><input type="number" min="0" required></div>
                <div class="field-row"><label>Primary 4 Total</label><input type="number" min="0" required></div>
                <div class="field-row"><label>Primary 5 Total</label><input type="number" min="0" required></div>
                <div class="field-row"><label>Primary 6 Total</label><input type="number" min="0" required></div>
            </fieldset>

            <!-- JHS Box -->
            <fieldset style="border-color: #00a2e8;">
                <legend style="color: #00a2e8 !important;">JHS Class Logs</legend>
                <div class="field-row"><label>JHS 1 Total</label><input type="number" min="0" required></div>
                <div class="field-row"><label>JHS 2 Total</label><input type="number" min="0" required></div>
                <div class="field-row"><label>JHS 3 Total</label><input type="number" min="0" required></div>
            </fieldset>
        </div>
    </form>
</div>

</body>
</html>
